# Nome do site de status
name: Ondigh Status
# URL onde o site ficará hospedado
url: https://status.ondigh.com.br
# Link para o site principal no cabeçalho
navbar:
  - title: Ondigh Home
    url: https://ondigh.com.br

# Configuração dos monitores (as APIs que você quer acompanhar)
sites:
  - name: Ondigh API Health
    url: https://ondigh.com.br/api/health
    method: GET
    # Você pode adicionar expectativa de status se necessário (padrão é 2xx)

  - name: Mercado Pago Status API
    url: https://api.mercadopago.com/status
    method: GET

  - name: Supabase Project API
    # Substitua pelo subdomínio real do seu projeto do Supabase se preferir monitorar sua instância direta
    url: https://status.supabase.com
    method: GET

# Configurações de notificação (opcional - remova o comentário para usar)
# notifications:
#   - type: discord
#     webhookUrl: "$DISCORD_WEBHOOK_URL"

# Configurações do Upptime
assignees:
  - ondigh # Seu usuário ou organização do GitHub
