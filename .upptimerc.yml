# ==============================================================================
# CONFIGURAÇÃO CORE DO REPOSITÓRIO (Correção do erro "Owner/repo not set")
# ==============================================================================
owner: tnsilva
repo: ondigh-status

# Nome do painel visual e link do subdomínio customizado mapeado
name: Status do Sistema | Ondigh
cname: ://ondigh.com.br
baseUrl: /

# Link de navegação para retornar ao site principal
navbar:
  - title: Voltar para Ondigh
    url: https://ondigh.com.br

# ==============================================================================
# CONFIGURAÇÃO DOS MONITORES (Mapeamento das suas APIs)
# ==============================================================================
sites:
  - name: Ondigh API (Local Tunnel)
    url: https://shiny-carrots-play.loca.lt
    method: GET
    assignees:
      - tnsilva

  - name: Gateway Mercado Pago
    url: https://mercadopago.com
    method: GET
    assignees:
      - tnsilva

  - name: Supabase Platform
    url: https://supabase.com
    method: GET
    assignees:
      - tnsilva


# ==============================================================================
# CONFIGURAÇÕES ADICIONAIS DO MONITORAMENTO
# ==============================================================================
# Define que os testes rodam a cada 5 minutos
workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  uptime: "*/5 * * * *"

# Configurações de exibição do gráfico de histórico
commitMessages:
  readme: ":memo: Update README [skip ci]"
  summary: ":card_index: Update status summary [skip ci]"
  statusChange: ":m: Status changed for $ENDPOINT"
  graphs: ":chart_with_upwards_trend: Update graphs [skip ci]"
